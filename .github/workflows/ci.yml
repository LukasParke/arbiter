name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-format:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # pnpm 11 requires Node >= 22.13; pin 10 so the full Node matrix works
          version: 10

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Run linter
        run: pnpm run lint -- --max-warnings 0

  build:
    name: Build and Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (tsc)
        run: pnpm run build

      - name: Package export smoke test
        run: |
          node -e "
          (async () => {
            const assert = await import('assert');
            for (const [entry, symbol] of [
              ['./dist/src/capture/index.js', 'startCaptureSession'],
              ['./dist/src/replay/index.js', 'replayCapture'],
              ['./dist/src/bundle/index.js', 'loadBundle'],
              ['./dist/src/validation/index.js', 'validateCapture'],
              ['./dist/src/gateway/index.js', 'startGateway'],
            ]) {
              const mod = await import(entry);
              assert.default(typeof mod[symbol] === 'function', entry + ' missing ' + symbol);
            }
            console.log('exports ok');
          })();
          "

      - name: CLI smoke test
        run: node dist/src/cli.js --help

  test:
    name: Tests
    needs: [lint-and-format, build]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: [20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (needed for CLI smoke tests)
        run: pnpm run build

      - name: Run tests
        run: pnpm run test:ci
