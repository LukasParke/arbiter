<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="0.5" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
  </defs>

  <!-- Outer seal: double ring -->
  <circle cx="256" cy="256" r="228" fill="none" stroke="url(#ring)" stroke-width="14"/>
  <circle cx="256" cy="256" r="204" fill="none" stroke="#14B8A6" stroke-width="3"
          opacity="0.55"/>

  <!-- Balance mast: from beam down to pedestal -->
  <line x1="256" y1="140" x2="256" y2="352" stroke="url(#teal)" stroke-width="13"
        stroke-linecap="round"/>

  <!-- Pedestal -->
  <path d="M226 376 L286 376 L272 352 L240 352 Z" fill="#0D9488"/>
  <line x1="212" y1="384" x2="300" y2="384" stroke="url(#teal)" stroke-width="11"
        stroke-linecap="round"/>

  <!-- Fulcrum: packet diamond at the beam pivot -->
  <rect x="-15" y="-15" width="30" height="30" rx="5"
        transform="translate(256,140) rotate(45)" fill="#5EEAD4"/>

  <!-- Beam with subtle taper illusion: rounded bar -->
  <line x1="136" y1="168" x2="376" y2="168" stroke="url(#teal)" stroke-width="13"
        stroke-linecap="round"/>
  <circle cx="136" cy="168" r="9" fill="#5EEAD4"/>
  <circle cx="376" cy="168" r="9" fill="#5EEAD4"/>

  <!-- Hanger wires -->
  <line x1="136" y1="176" x2="136" y2="216" stroke="url(#teal)" stroke-width="7"
        stroke-linecap="round"/>
  <line x1="376" y1="176" x2="376" y2="216" stroke="url(#teal)" stroke-width="7"
        stroke-linecap="round"/>

  <!-- Pans: classic arcs -->
  <path d="M92 220 A44 44 0 0 0 180 220 Z" fill="none" stroke="url(#teal)"
        stroke-width="11" stroke-linejoin="round"/>
  <path d="M332 220 A44 44 0 0 0 420 220 Z" fill="none" stroke="url(#teal)"
        stroke-width="11" stroke-linejoin="round"/>
  <!-- Pan contents: weighed packets -->
  <circle cx="136" cy="212" r="10" fill="#5EEAD4"/>
  <circle cx="376" cy="212" r="10" fill="#5EEAD4"/>
</svg>
