<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0B1120"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
    <radialGradient id="panL" cx="0.5" cy="0.35" r="0.9">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#312E81"/>
    </radialGradient>
    <radialGradient id="panR" cx="0.5" cy="0.35" r="0.9">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#312E81"/>
    </radialGradient>
  </defs>

  <!-- App tile -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="url(#tile)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none"
        stroke="#334155" stroke-width="2" opacity="0.6"/>

  <!-- Ground line -->
  <line x1="150" y1="404" x2="362" y2="404" stroke="#334155" stroke-width="10"
        stroke-linecap="round"/>

  <!-- Mast -->
  <line x1="256" y1="118" x2="256" y2="396" stroke="#6366F1" stroke-width="16"
        stroke-linecap="round"/>

  <!-- Beam -->
  <line x1="120" y1="170" x2="392" y2="170" stroke="#6366F1" stroke-width="16"
        stroke-linecap="round"/>

  <!-- Fulcrum: packet diamond -->
  <g transform="translate(256,132)">
    <rect x="-21" y="-21" width="42" height="42" rx="7"
          transform="rotate(45)" fill="#22D3EE"/>
    <rect x="-21" y="-21" width="42" height="42" rx="7"
          transform="rotate(45)" fill="none" stroke="#0B1120" stroke-width="5" opacity="0.55"/>
  </g>

  <!-- Hanger wires -->
  <line x1="120" y1="176" x2="120" y2="258" stroke="#64748B" stroke-width="7"
        stroke-linecap="round"/>
  <line x1="392" y1="176" x2="392" y2="258" stroke="#64748B" stroke-width="7"
        stroke-linecap="round"/>

  <!-- Left pan: endpoint node -->
  <circle cx="120" cy="292" r="46" fill="url(#panL)"
          stroke="#818CF8" stroke-width="7"/>
  <circle cx="120" cy="292" r="13" fill="#22D3EE"/>

  <!-- Right pan: endpoint node -->
  <circle cx="392" cy="292" r="46" fill="url(#panR)"
          stroke="#818CF8" stroke-width="7"/>
  <circle cx="392" cy="292" r="13" fill="#22D3EE"/>

  <!-- Verdict ticks inside pans -->
  <path d="M100 292 l14 15 l26 -30" fill="none" stroke="#0B1120"
        stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  <path d="M372 292 l14 15 l26 -30" fill="none" stroke="#0B1120"
        stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
</svg>
