[package]
name = "arbiter"
version = "1.1.0"
edition = "2021"
description = "API proxy with OpenAPI generation, exact capture/replay, and HAR export"
license = "MIT"
repository = "https://github.com/LukasParke/arbiter"

[lib]
name = "arbiter"
path = "src/lib.rs"

[[bin]]
name = "arbiter"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["http1"] }
tower = { version = "0.5", features = ["util"] }
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "http2", "tokio"] }
http = "1"
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls-native-roots", "http2"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
clap = { version = "4", features = ["derive", "env"] }
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
regex = "1"
flate2 = "1"
brotli = "8"
zstd = "0.13"
rand = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde", "clock"], default-features = false }
url = "2"
percent-encoding = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
